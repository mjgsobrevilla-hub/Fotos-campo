name: Construir APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Compilar
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Renombrar APK
        run: cp app/build/outputs/apk/release/app-release.apk CampoCamara.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CampoCamara-apk
          path: CampoCamara.apk

      - name: Publicar en "Releases" (para descargar desde el celular)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ultima -y --cleanup-tag || true
          gh release create ultima CampoCamara.apk \
            --title "Campo Cámara (versión ${{ github.run_number }})" \
            --notes "Descarga CampoCamara.apk desde el celular e instálalo."
